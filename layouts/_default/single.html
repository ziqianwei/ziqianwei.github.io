{{ define "main" }}
<article class="article">
  <header class="article-header">
    <a class="eyebrow" href="/{{ .Section }}/">{{ title .Section }}</a>
    <h1>{{ .Title }}</h1>
    <div class="article-meta">
      <span>{{ .Date.Format "January 2, 2006" }}</span>
      {{ with .Params.tags }}<span>{{ delimit . " · " }}</span>{{ end }}
    </div>
  </header>
  <div class="prose">
    {{ .Content }}
  </div>
</article>
{{ end }}
